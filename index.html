<!doctype html>
<html lang="en">
  <head>
    <link rel="stylesheet" href="./src/css/styles.css" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />

    <link
      href="https://fonts.googleapis.com/css2?family=Happy+Monkey&family=Orbitron:wght@400..900&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="header">
      <h1>Today is Meili's birthday</h1>
      <img src="./images/meiliProf.jpg" alt="birthday_person_image" id="pfp" />
      <h3 id="bday-age">x years old</h3>
      <h4 id="bday-date">Random Date</h4>
    </div>

    <h2 class="gift-title">Here's how happy I am for you today</h2>
    <h3 class="gift-hint">(Hover over the gift)</h3>
    <div class="gift-img" id="gift-img-happy"></div>

    <h2 class="gift-title">Here's how people react when you enter the room</h2>
    <div class="gift-img" id="gift-img-enter"></div>

    <h2 class="gift-title">Here's how people would describe you in one word</h2>
    <div class="gift-img" id="gift-img-impressed"></div>
  </body>

  <footer>
    <p id="ftr">
      Want to create your own birthday GIFt site? Take<a
        href="https://www.google.com/"
      >
        this HTML&CSS course</a
      >
    </p>
  </footer>
</html>
